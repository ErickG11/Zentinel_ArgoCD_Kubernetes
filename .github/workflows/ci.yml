# Integración continua de Zentinel Store.
#  - push / pull request: instala, valida (lint + typecheck), prueba y compila servidor y web.
#  - tag vX.Y.Z: además construye la imagen Docker y la publica en Docker Hub.
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  y  DOCKERHUB_TOKEN (token de acceso de Docker Hub, no la contraseña)
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, web]
    defaults:
      run:
        working-directory: app/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Publicar imagen en Docker Hub
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular versión desde el tag (v1.2.3 → 1.2.3)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          # Tag fijo de versión; nunca se publica "latest".
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/zentinel-store:${{ steps.ver.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
